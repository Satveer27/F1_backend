# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch, or else costly
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


    
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  startup-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    services:
      postgres-db-test:
        image: postgres:15.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5 

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies for python 
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv 
          uv sync --group dev
      
      # Alembic migration
      - name: run alembic migrations
        run: uv run alembic upgrade head
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/test_db
      
      # Alembic migration checks
      - name: check for missing migrations
        run: uv run alembic check
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/test_db
      
      # Run tests
      - name: Run tests
        run: uv run pytest --disable-warnings -q
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/test_db
      
  dockerfile-build:
    runs-on: ubuntu-latest
    needs: startup-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start app via docker-compose
        run: docker compose up -d --build
      
      - name: Wait and check health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl --fail http://localhost:8000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 3
          done
          echo "App failed to become healthy in time"
          exit 1
      
      - name: tear down
        run: docker compose down

